<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="__APP_DESCRIPTION__">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b0f09">
  <meta property="og:title" content="__APP_TITLE__">
  <meta property="og:description" content="__APP_DESCRIPTION__">
  <meta property="og:url" content="https://vdustr.dev/wasm4-falling-block/">
  <meta property="og:image" content="https://vdustr.dev/wasm4-falling-block/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:type" content="image/png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://vdustr.dev/wasm4-falling-block/og-image.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="__APP_TITLE__">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>__APP_TITLE__</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.090 0.000 0);
      --surface: oklch(0.165 0.030 110);
      --panel: oklch(0.230 0.050 110);
      --ink: oklch(0.935 0.012 110);
      --muted: oklch(0.735 0.035 110);
      --primary: oklch(0.430 0.090 110);
      --screen: oklch(0.810 0.130 135);
      --accent: oklch(0.620 0.170 32);
      --danger: oklch(0.560 0.180 28);
      --focus: oklch(0.780 0.160 135);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button {
      font: inherit;
    }

    .app-shell {
      width: 100%;
      height: 100svh;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: clamp(10px, 3vw, 24px);
    }

    body[data-update-visible="true"] .app-shell {
      padding-bottom: calc(clamp(10px, 3vw, 24px) + 82px);
    }

    .stage {
      width: min(100%, 920px);
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(188px, 320px) minmax(268px, 1fr);
      gap: clamp(14px, 2.5vw, 22px);
      align-items: stretch;
    }

    .home-panel,
    .game-panel {
      min-width: 0;
      background: var(--surface);
      border-radius: 12px;
    }

    .home-panel {
      padding: clamp(14px, 2.2vw, 22px);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 2vw, 18px);
      justify-content: space-between;
    }

    .title-block {
      display: grid;
      gap: 10px;
    }

    .brand-lockup {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: clamp(68px, 8vw, 92px);
      height: auto;
      flex: 0 0 auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px oklch(0 0 0 / 0.32));
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    h1 {
      min-width: 0;
      margin: 0;
      color: var(--ink);
      font-size: 2rem;
      line-height: 1;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .summary {
      margin: 0;
      color: var(--muted);
      max-width: 34ch;
      line-height: 1.42;
      text-wrap: pretty;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .primary-button {
      min-height: 42px;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .primary-button {
      border: 0;
      background: var(--accent);
      color: var(--ink);
      font-weight: 700;
    }

    .primary-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .notes {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .notes code {
      color: var(--screen);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.9em;
    }

    .game-panel {
      min-height: min(520px, calc(100svh - 48px));
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
    }

    .viewport-frame {
      width: min(100%, 500px, calc(100svh - 80px));
      min-width: 0;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg);
      contain: paint;
    }

    .game-iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: var(--bg);
    }

    .site-footer {
      width: min(100%, 920px);
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .site-footer a {
      color: var(--screen);
      text-decoration: none;
    }

    .site-footer a:hover {
      text-decoration: underline;
    }

    .update-prompt {
      position: fixed;
      inset: auto 16px 16px auto;
      width: min(340px, calc(100vw - 32px));
      padding: 12px;
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      display: none;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      z-index: 30;
    }

    .update-prompt[data-visible="true"] {
      display: flex;
    }

    .update-prompt p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .update-prompt .primary-button {
      min-width: 126px;
      white-space: nowrap;
    }

    @media (max-width: 720px) {
      .app-shell {
        align-items: stretch;
        justify-content: start;
        padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
        gap: 10px;
      }

      body[data-update-visible="true"] .app-shell {
        padding-bottom: 92px;
      }

      .stage {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .home-panel {
        padding: 16px;
        gap: 12px;
      }

      .title-block {
        gap: 8px;
      }

      .brand-lockup {
        gap: 10px;
      }

      .brand-icon {
        width: 62px;
      }

      h1 {
        font-size: 1.75rem;
      }

      .notes {
        gap: 6px;
        font-size: 0.78rem;
      }

      .game-panel {
        min-height: auto;
        padding: 10px;
      }

      .viewport-frame {
        width: min(100%, 58svh, 430px);
      }

      .site-footer {
        justify-content: center;
        text-align: center;
      }

      body[data-play-view="true"] {
        overscroll-behavior: none;
      }

      body[data-play-view="true"] .app-shell {
        align-items: center;
        justify-content: center;
        gap: 0;
        overflow: hidden;
        padding: max(6px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left));
      }

      body[data-play-view="true"][data-update-visible="true"] .app-shell {
        padding-bottom: max(6px, env(safe-area-inset-bottom));
      }

      body[data-play-view="true"] .stage {
        width: 100%;
        height: 100%;
        max-width: none;
        display: flex;
        align-items: center;
        justify-content: stretch;
        gap: 0;
      }

      body[data-play-view="true"] .home-panel,
      body[data-play-view="true"] .site-footer {
        display: none;
      }

      body[data-play-view="true"] .game-panel {
        width: 100%;
        flex: 1 1 auto;
        height: 100%;
        min-height: 0;
        padding: 0;
        border-radius: 0;
        background: var(--bg);
      }

      body[data-play-view="true"] .viewport-frame {
        width: min(100%, 460px);
        height: 100%;
        max-width: 100%;
        max-height: 100%;
        aspect-ratio: auto;
        border-radius: 0;
      }

      body[data-play-view="true"] .update-prompt {
        inset: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) auto max(8px, env(safe-area-inset-left));
        width: auto;
        opacity: 0.92;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="stage">
      <section class="home-panel" aria-labelledby="gameTitle">
        <div class="title-block">
          <div class="status-row">
            <span>WASM-4 cartridge</span>
            <span>Offline ready</span>
          </div>
          <div class="brand-lockup">
            <img class="brand-icon" src="icon-192.png" width="192" height="192" alt="" aria-hidden="true" decoding="async">
            <h1 id="gameTitle">__APP_TITLE__</h1>
          </div>
          <p class="summary">__APP_DESCRIPTION__</p>
        </div>

        <div class="actions">
          <button class="primary-button" type="button" id="startGame">Enter game</button>
        </div>

        <div class="notes">
          <span>Enter focuses the WASM-4 runtime. Press <code>X</code> or <code>Z</code> in the cartridge to begin.</span>
        </div>
      </section>

      <section class="game-panel" aria-label="Falling Block game viewport">
        <div class="viewport-frame">
          <iframe class="game-iframe" id="gameFrame" src="cart.html" title="__APP_TITLE__ cartridge" allow="fullscreen; gamepad"></iframe>
        </div>
      </section>

    </div>

    <footer class="site-footer">
      <span>MIT License, 2026 VdustR (ViPro)</span>
      <a href="https://github.com/vdustr/wasm4-falling-block" rel="noreferrer">GitHub</a>
    </footer>
  </main>

  <aside class="update-prompt" id="updatePrompt" role="status" aria-live="polite">
    <p>A new offline build is ready.</p>
    <button class="primary-button" type="button" id="reloadUpdate">Reload game</button>
  </aside>

  <script>
    const gameFrame = document.getElementById("gameFrame");
    const updatePrompt = document.getElementById("updatePrompt");
    const reloadUpdate = document.getElementById("reloadUpdate");
    const mobilePlayQuery = window.matchMedia("(max-width: 720px)");
    let waitingWorker = null;

    function focusGame() {
      gameFrame.scrollIntoView({ block: "center", inline: "center" });
      gameFrame.focus();
    }

    function enterMobileFullscreen() {
      if (!mobilePlayQuery.matches) {
        return;
      }

      document.body.dataset.playView = "true";

      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen({ navigationUI: "hide" }).catch(() => {});
      }

      if (screen.orientation?.lock) {
        screen.orientation.lock("portrait").catch(() => {});
      }
    }

    document.addEventListener("fullscreenchange", () => {
      document.body.dataset.fullscreen = document.fullscreenElement ? "true" : "false";
    });

    document.getElementById("startGame").addEventListener("click", () => {
      enterMobileFullscreen();
      focusGame();
    });

    function showUpdate(worker) {
      waitingWorker = worker;
      document.body.dataset.updateVisible = "true";
      updatePrompt.dataset.visible = "true";
    }

    reloadUpdate.addEventListener("click", () => {
      waitingWorker?.postMessage({ type: "SKIP_WAITING" });
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then((registration) => {
        if (registration.waiting) {
          showUpdate(registration.waiting);
        }

        registration.addEventListener("updatefound", () => {
          const worker = registration.installing;
          worker?.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) {
              showUpdate(worker);
            }
          });
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        window.location.reload();
      });
    }
  </script>
</body>
</html>
