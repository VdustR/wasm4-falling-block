[package]
name = "falling-block"
version = "0.1.0"
edition = "2021"
authors = ["VdustR (ViPro)"]
license = "MIT"
description = "A Tetris-like falling block puzzle for WASM-4 with offline PWA support, mobile controls, and handmade chiptune audio."
repository = "https://github.com/vdustr/wasm4-falling-block"

[lib]
crate-type = ["cdylib"]

[dependencies]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
